name: Deploy frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm run build runs tsc, which currently fails on pre-existing type
      # errors in Workspace.tsx — build with Vite directly until those are fixed.
      # Prerender bakes the landing page HTML into dist/index.html for SEO
      # (fails soft — never blocks the deploy).
      - name: Build
        run: |
          npx vite build
          node scripts/prerender.mjs

      - name: Deploy to Netlify (production)
        run: |
          npx netlify-cli deploy --prod --no-build --dir=dist \
            --site "$NETLIFY_SITE_ID" \
            --message "GitHub Actions: $GITHUB_SHA"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Verify live site
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://lucentreport.com/)
          echo "lucentreport.com -> $code"
          test "$code" = "200"

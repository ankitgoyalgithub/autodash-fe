<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>LucentReport — AI Dashboard Builder | Plain-English Analytics</title>
    <meta name="description" content="Connect any database, ask in plain English, and LucentReport's AI builds complete dashboards — charts, forecasts, and insights in seconds. Free to start." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0c1445" />
    <link rel="canonical" href="https://lucentreport.com/" />

    <!-- Open Graph / LinkedIn / Slack previews -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lucentreport.com/" />
    <meta property="og:title" content="LucentReport — AI Dashboard Builder for Any Data Source" />
    <meta property="og:description" content="Connect any database or cloud source, ask in plain English, and LucentReport's AI builds complete dashboards with charts, forecasts, and analytics in seconds. Finance AI Agents, PDF/PPTX export. No SQL needed." />
    <meta property="og:image" content="https://lucentreport.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LucentReport AI dashboard showing revenue charts and KPI cards" />
    <meta property="og:site_name" content="LucentReport" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LucentReport — AI Dashboard Builder for Any Data Source" />
    <meta name="twitter:description" content="Turn data from any source into beautiful AI-powered dashboards in seconds. Finance AI Agents, 15+ chart types, PDF/PPTX export. Plain English queries. No SQL needed." />
    <meta name="twitter:image" content="https://lucentreport.com/og-image.png" />
    <meta name="twitter:image:alt" content="LucentReport AI dashboard" />

    <!-- Structured Data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "LucentReport",
      "alternateName": "LucentReport AI Dashboard Builder",
      "applicationCategory": "BusinessApplication",
      "applicationSubCategory": "Data Visualization",
      "operatingSystem": "Web",
      "url": "https://lucentreport.com",
      "description": "AI-powered multi-database dashboard builder that converts plain English questions into charts, forecasts, and executive reports from any data source — using a multi-agent AI pipeline with Finance AI Agents and PDF/PPTX export.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "description": "Free to explore"
      },
      "featureList": [
        "Natural language to SQL conversion",
        "Multi-agent AI pipeline (Planner, SQL Expert, Validator, Enricher)",
        "Automatic chart type selection",
        "15+ chart types: bar, line, area, pie, combo, scatter, table, treemap, sunburst, Sankey, bump chart, force graph",
        "Advanced analytics: forecasting, anomaly detection, Pareto analysis, trend decomposition, correlation heatmap, priority matrix",
        "7 Finance AI Agents: Reconciliation, Month-End Close, Variance Analysis, Financial Statement Close, Actuals Reporting, Exception Identification, Close Process Monitoring",
        "PDF, PPTX, and PNG export pipeline via headless browser rendering",
        "PostgreSQL, MySQL, Snowflake, BigQuery, Redshift, Salesforce, S3, Google Drive support",
        "Public dashboard deployment via shareable URL",
        "Role-based access control (Admin, Editor, Viewer)",
        "Multiple themes, color palettes, and brand kit",
        "Drill-down and global filter support",
        "Read-only SQL execution for data security",
        "httpOnly cookie authentication to prevent XSS token theft"
      ],
      "screenshot": "https://lucentreport.com/og-image.png"
    }
    </script>

    <!-- Structured Data: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "LucentReport",
      "url": "https://lucentreport.com",
      "description": "AI-powered multi-database dashboard builder with Finance AI Agents and PDF/PPTX export"
    }
    </script>

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "LucentReport",
      "url": "https://lucentreport.com",
      "logo": "https://lucentreport.com/app-icon.png",
      "description": "LucentReport builds AI-powered dashboards, reports, and finance analytics from plain-English questions over any database or cloud data source."
    }
    </script>

    <!-- Structured Data: FAQPage — must stay in sync with FAQ_ITEMS in src/components/LandingPage.tsx -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Do I need to know SQL or BI tools?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. You describe what you want in plain English — \"Show monthly revenue by product category\" — and LucentReport's multi-agent AI plans the query, writes the SQL, runs it on your live data, picks the right charts, and writes the insights. No SQL, no drag-and-drop, no DAX."
          }
        },
        {
          "@type": "Question",
          "name": "Which data sources can I connect?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A wide range: PostgreSQL, MySQL, SQL Server, Snowflake, Google BigQuery, Amazon Redshift, Amazon S3 (via Athena), Salesforce, HubSpot, Google Sheets, Supabase, and more. If your data lives somewhere, LucentReport can usually reach it."
          }
        },
        {
          "@type": "Question",
          "name": "Is my data safe?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Your database credentials stay encrypted on your own server and are never sent to us. Every query runs in strict read-only mode — LucentReport can never modify, delete, or write to your database. Auth uses httpOnly cookies so tokens can't be stolen by scripts."
          }
        },
        {
          "@type": "Question",
          "name": "What can it actually build?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Complete, styled dashboards with 15+ chart types, plus a full analytics layer (forecasts, anomaly detection, priority matrices, Pareto analysis, correlation heatmaps). It also generates narrative reports, poster-style infographics, and single-entity 360° profiles — all from your data."
          }
        },
        {
          "@type": "Question",
          "name": "Can I export or share what I build?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Absolutely. Export any dashboard to PowerPoint, PDF, or a high-resolution PNG poster with one click — pixel-perfect and board-ready. Or publish a live public link that stakeholders can open without an account."
          }
        },
        {
          "@type": "Question",
          "name": "Does it handle finance and accounting work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes — seven Finance AI Agents come pre-loaded with domain expertise: Reconciliation, Month-End Close, Variance Analysis, Financial Statement Close, Actuals Reporting, Exception Identification, and Close Process Monitoring. Each already knows the outputs, patterns, and escalation logic for its workflow."
          }
        },
        {
          "@type": "Question",
          "name": "How is this different from Power BI or Tableau?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Those tools ask you to build the report. LucentReport builds it for you — a complete, branded dashboard from one sentence in seconds. No data modeling, no formulas, no dashboard design work. You ask the question; the AI does the rest."
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
